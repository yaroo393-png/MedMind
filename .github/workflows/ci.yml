name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:secrets
  emulator:
    # Security Rules (R-1…R-14) + firestoreRepo กับ Firebase Emulator — ต้องใช้ Java และ firebase-tools (ติดตั้งเฉพาะงานนี้)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
        working-directory: emulator-tests
      - run: npm test
        working-directory: emulator-tests
